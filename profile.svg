  <rect x="68" y="106" width="76" height="10" rx="5" fill="#38bdf8"/>
  <rect x="152" y="106" width="96" height="10" rx="5" fill="#94a3b8" opacity="0.5"/>
  <rect x="84" y="126" width="140" height="10" rx="5" fill="#818cf8"/>
